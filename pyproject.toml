[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-in-production"
version = "1.0.0"
description = "Companion code for the book AI Agents in Production."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bhanu Mahesh" }]
keywords = ["agents", "llm", "durable-execution", "evaluation", "otel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

# Mock mode is the default mode, and mock mode has no runtime dependencies
# beyond the Python standard library. This is deliberate: `pip install -e .`
# followed by `pytest` must pass on a machine with no network and no keys.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
live = [
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.urls]
Homepage = "https://github.com/bhanumahesh1993/ai-agents-in-production"
Repository = "https://github.com/bhanumahesh1993/ai-agents-in-production"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "artifacts"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
# UP042 wants StrEnum. `str, Enum` is deliberate: it keeps str(Currency.USD)
# rendering as "Currency.USD" in reprs while still comparing equal to "USD",
# which is what the fixtures and the JSON round-trip tests expect.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["packages"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
