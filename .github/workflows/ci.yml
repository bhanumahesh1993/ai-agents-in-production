name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # Mock mode is the default and must never touch the network. If a test
      # starts requiring an API key or an outbound call, this job is where we
      # want to find out.
      - name: Test
        env:
          NORTHSTAR_MODEL: mock
        run: pytest -q

      # An external audit found the book printing 28 artifact paths while this
      # repository contained one directory. Every test passed throughout, so
      # that class of defect needs its own check, run against the manuscript.
      # The manuscript is not in this repository, so this step is skipped when
      # it is absent and enforced when the book is checked out alongside.
      - name: Printed paths exist
        run: |
          if [ -d ../manuscript ]; then
            python tools/check_printed_paths.py ../manuscript
          else
            echo "manuscript not present; skipping printed-path check"
          fi

      # Every chapter demo must run offline and exit zero. This is what makes
      # the book's "make demo-chNN" promise verifiable rather than aspirational.
      - name: Every chapter demo runs offline
        env:
          NORTHSTAR_MODEL: mock
        run: make demos
